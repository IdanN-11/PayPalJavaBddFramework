services:

  selenium-hub:
    image: selenium/hub:4.18.1
    container_name: selenium-hub
    ports:
      - "4444:4444"

  chrome:
    image: selenium/node-chrome:4.18.1
    container_name: chrome
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
    ports:
      - "5901:5900"

  edge1:
    image: selenium/node-edge:4.18.1
    container_name: edge1
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
    ports:
      - "5902:5900"


  edge2:
    image: selenium/node-edge:4.18.1
    container_name: edge2
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

    ports:
      - "5903:5900"


  edge3:
    image: selenium/node-edge:4.18.1
    container_name: edge3
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

  edge4:
    image: selenium/node-edge:4.18.1
    container_name: edge4
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

  edge5:
    image: selenium/node-edge:4.18.1
    container_name: edge5
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

  test-runner:
    container_name: paypal-test-runner
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - chrome
      - edge1
      - edge2
      - edge3
      - edge4
      - edge5
    environment:
      SELENIUM_GRID_URL: http://selenium-hub:4444/wd/hub
    volumes:
      - ./target:/app/target
