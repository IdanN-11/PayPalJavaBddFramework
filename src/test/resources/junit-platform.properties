# Glue (step definitions package)
cucumber.glue=com.example.paypal.steps,com.example.paypal.hooks

# Features location (alternative to annotation)
cucumber.features=src/test/resources/features

# Plugins / reports
cucumber.plugin=pretty,json:target/cucumber-reports/cucumber.json

# Optional: tags, monochrome, etc.
cucumber.filter.tags=not @ignore
cucumber.execution.dry-run=false
cucumber.publish.enabled=false